diagram:
  kind: deployment
  name: 银行储蓄系统-部署图
module: 部署视图

elements:
  - id: user
    kind: actor
    text: 用户
    at: [80, 100]
  - id: clerk
    kind: actor
    text: 工作人员
    at: [80, 260]
  - id: app
    kind: node
    text: 系统服务器节点
    at: [300, 60]
    w: 240
    h: 330
    children: [开户, 存款, 取款]
  - id: db
    kind: node
    text: 数据服务器节点
    at: [740, 140]
    w: 190
    h: 170

relations:
  - {from: user, to: app}
  - {from: clerk, to: app}
  - {from: app, to: db, kind: communication}
